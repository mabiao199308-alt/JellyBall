<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地图随机预览</title>
    <link rel="stylesheet" href="./map_preview.css" />
  </head>
  <body>
    <main class="preview-page">
      <header class="toolbar">
        <h1>随机地图预览</h1>
        <div class="toolbar__controls">
          <label>
            目标米数
            <input id="metersInput" type="number" min="50" max="1000" step="10" value="200" />
          </label>
          <label>
            视口高度(m)
            <input id="visibleMetersInput" type="number" min="10" max="200" step="1" value="50" />
          </label>
          <label>
            视口起点(m)
            <input id="viewportInput" type="number" min="0" max="0" step="0.1" value="0" />
          </label>
          <button id="prevScreenBtn" type="button">上一屏</button>
          <button id="nextScreenBtn" type="button">下一屏</button>
          <button id="generateBtn" type="button">生成预览</button>
          <button id="regenBtn" type="button">重随机</button>
        </div>
        <p class="toolbar__tips">说明：默认按 50m 视口显示（同宽度比例）。可用滑条 / 滚轮在整段地图中滚动查看。</p>
        <input id="scrollRange" class="scroll-range" type="range" min="0" max="0" step="0.1" value="0" />
      </header>

      <section class="stats" id="statsPanel"></section>

      <section class="canvas-wrap">
        <canvas id="previewCanvas" width="390" height="844"></canvas>
      </section>
    </main>

    <script type="module" src="/src/map_preview.ts"></script>
  </body>
</html>
