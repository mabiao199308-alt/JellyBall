<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>皮筋弹射球</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-wrap">
      <section class="phone-shell" id="gameShell">
        <div class="hud">
          <div class="hud-meter" id="meterDisplay">高度：0米</div>
        </div>
        <div class="tutorial-overlay is-hidden" id="tutorialOverlay" aria-hidden="true">
          <div class="tutorial-overlay__text">拉动果冻，松手发射！</div>
          <div class="tutorial-overlay__gesture">
            <div class="tutorial-overlay__trail"></div>
            <img class="tutorial-overlay__hand" src="./HandPointer.png" alt="滑动手势" />
          </div>
        </div>
        <canvas id="gameCanvas"></canvas>
      </section>

      <aside class="debug-panel" id="debugPanel">
        <h2>调试面板</h2>
        <div class="debug-panel__body" id="debugPanelBody"></div>
        <div class="debug-panel__actions">
          <button id="toggleAdvancedBtn" type="button">显示全部</button>
          <button id="saveCfgBtn" type="button">保存参数</button>
          <button id="saveAsDefaultBtn" type="button">保存到默认值</button>
          <button id="copyCfgCodeBtn" type="button">保存到代码默认</button>
          <button id="defaultCfgBtn" type="button">恢复默认</button>
        </div>
        <p class="debug-panel__status" id="cfgStatus">参数实时生效，点击保存写入本地。</p>
      </aside>

      <aside class="debug-panel debug-panel--deathfx" id="deathFxDebugPanel">
        <h2>死亡特效调试</h2>
        <div class="debug-panel__body" id="deathFxDebugPanelBody"></div>
        <div class="debug-panel__actions">
          <button id="deathFxPreviewBtn" type="button">预览特效</button>
          <button id="deathFxPlaySfxBtn" type="button">播放音效</button>
          <button id="deathFxDefaultBtn" type="button">恢复默认</button>
        </div>
        <p class="debug-panel__status" id="deathFxCfgStatus">参数实时生效。</p>
      </aside>

      <aside class="debug-panel debug-panel--jelly" id="jellyDebugPanel">
        <h2>果冻形变调试</h2>
        <div class="debug-panel__body" id="jellyDebugPanelBody"></div>
        <div class="debug-panel__actions">
          <button id="jellyDefaultBtn" type="button">恢复默认</button>
        </div>
        <p class="debug-panel__status" id="jellyCfgStatus">参数实时生效：重点调“蓄力拉满按住”的形变与晃动。</p>
      </aside>

      <aside class="debug-panel debug-panel--hazard" id="hazardDebugPanel">
        <h2>障碍生成调试</h2>
        <div class="debug-panel__body" id="hazardDebugPanelBody"></div>
        <div class="debug-panel__actions">
          <button id="hazardSaveBtn" type="button">保存参数</button>
          <button id="hazardSaveAsDefaultBtn" type="button">保存到默认值</button>
          <button id="hazardSaveCodeBtn" type="button">保存到代码默认</button>
          <button id="hazardDefaultBtn" type="button">恢复默认</button>
        </div>
        <p class="debug-panel__status" id="hazardCfgStatus">参数实时生效，点击保存写入本地。</p>
      </aside>

      <button class="debug-toggle debug-toggle--physics" id="debugToggleBtn" type="button">显示调试</button>
      <button class="debug-toggle debug-toggle--deathfx" id="deathFxDebugToggleBtn" type="button">显示死亡特效调试</button>
      <button class="debug-toggle debug-toggle--jelly" id="jellyDebugToggleBtn" type="button">显示果冻形变调试</button>
      <button class="debug-toggle debug-toggle--hazard" id="hazardDebugToggleBtn" type="button">显示障碍生成调试</button>
      <a class="preview-entry" href="./jelly_preview.html" target="_blank" rel="noopener noreferrer">查看大果冻</a>
      <button class="preview-entry preview-entry--tutorial" id="clearDataBtn" type="button">清除数据</button>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
