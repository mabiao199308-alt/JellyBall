<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>果冻实验室</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; }
      .lab { min-height: 100vh; display: grid; grid-template-columns: 160px 360px 380px; align-items: start; justify-content: center; gap: 18px; padding: 18px; }
      .preview, .panel, .tab-nav { border-radius: 18px; background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(148, 163, 184, 0.22); box-shadow: 0 16px 48px rgba(2, 6, 23, 0.35); }
      .tab-nav { position: sticky; top: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .tab-nav h1 { margin: 0; font-size: 18px; }
      .tab-nav p { margin: 0; color: #cbd5e1; font-size: 13px; }
      .preview { position: sticky; top: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .preview h1, .panel h2 { margin: 0; font-size: 18px; }
      .preview p, .panel p { margin: 0; color: #cbd5e1; font-size: 13px; }
      #previewCanvas { width: min(100%, 260px); aspect-ratio: 1 / 1; align-self: center; border-radius: 16px; background: #f8fafc; }
      .tabs { display: flex; flex-direction: column; gap: 8px; }
      .tab-btn { appearance: none; border: 1px solid rgba(255,255,255,0.18); background: rgba(30, 41, 59, 0.7); color: #cbd5e1; border-radius: 14px; padding: 10px 12px; font-size: 13px; cursor: pointer; text-align: left; }
      .tab-btn.is-active { background: #2563eb; border-color: rgba(147,197,253,0.85); color: #eff6ff; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
      .toolbar a, .toolbar button { appearance: none; border: 1px solid rgba(255,255,255,0.24); background: rgba(30, 41, 59, 0.92); color: #f8fafc; border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 13px; cursor: pointer; }
      .is-hidden { display: none !important; }
      .panel { max-height: calc(100vh - 36px); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
      .panel-body { overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
      .group-title { margin-top: 8px; font-size: 13px; color: #93c5fd; }
      .row { display: flex; flex-direction: column; gap: 6px; }
      .row-title { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
      .row input[type="range"], .row input[type="color"] { width: 100%; }
      .status { font-size: 12px; color: #bfdbfe; }
      @media (max-width: 1100px) { .lab { grid-template-columns: 1fr; } .tab-nav, .panel, .preview { position: static; max-height: none; } #previewCanvas { width: min(100%, 240px); } }
    </style>
  </head>
  <body>
    <main class="lab">
      <aside class="tab-nav">
        <h1>果冻实验室</h1>
        <p>页签放在最外层；切换页签时，左侧参数和右侧预览都会一起切换。</p>
        <div class="tabs" id="previewTabs">
          <button type="button" class="tab-btn is-active" data-tab="ball">小球本体</button>
          <button type="button" class="tab-btn" data-tab="death">死亡动画</button>
        </div>
      </aside>

      <aside class="panel">
        <h2 id="panelTitle">小球本体参数</h2>
        <div class="panel-body" id="panelBody"></div>
      </aside>

      <section class="preview">
        <p id="previewDesc">这里只预览小球本体效果，保存后会同步到游戏里的小球表现。</p>
        <canvas id="previewCanvas" width="420" height="420"></canvas>
        <div class="toolbar">
          <a href="./index.html" target="_blank" rel="noreferrer">打开游戏</a>
          <button type="button" id="replayDeathBtn" class="is-hidden">重播死亡</button>
          <button type="button" id="saveBtn">保存到游戏</button>
          <button type="button" id="saveDefaultBtn">保存到默认</button>
          <button type="button" id="resetBtn">恢复默认</button>
        </div>
        <p class="status" id="statusText">修改会实时预览；点击保存后，游戏页会读取这份配置。</p>
      </section>
    </main>

    <script src="./ball_visual.js"></script>
    <script src="./death_fx.js"></script>
    <script src="./jelly_lab.js"></script>
  </body>
</html>
